<!DOCTYPE html>
<html>

<head>
    <style>
        .container {
            display: flex;
            background-color: DodgerBlue;
            flex-direction: column;
            gap: 40;
        }

        .container div {
            background-color: #f1f1f1;
            margin: 5px;
            padding: 10px;
            font-size: 8px;

        }
    </style>
</head>

<body>

    <h1>Create a Flex Container</h1>

    <div class="container">
        <div><img src="image1.png" alt="Limited Edition" width="132" height="170"></div>
        <div><img src="imagecopy.png" alt="Limited Edition" width="132" height="170"></div>
        <div><img src="image copy.png" alt="Limited Edition" width="132" height="170"></div>
    </div>

    <p>Flexbox must have a parent element with the display property set to flex or inline-flex.</p>
    <p>Direct child elements of the flex container automatically becomes flex items.</p>

</body>

</html>
